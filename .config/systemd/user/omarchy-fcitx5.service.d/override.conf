# Free the seat's input-method-v2 slot for wvkbd (on-screen keyboard, toggled
# via hyprgrass edge gesture). fcitx5's waylandim frontend grabs the slot
# exclusively; fcitx5 stays running for XCompose in XWayland clients.
# Revert: delete this file, then:
#   systemctl --user daemon-reload && systemctl --user restart omarchy-fcitx5
[Service]
ExecStart=
ExecStart=/usr/bin/fcitx5 --disable notificationitem,waylandim
