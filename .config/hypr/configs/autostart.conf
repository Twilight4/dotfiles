# Core components
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once=/usr/bin/gnome-keyring-daemon --start --components=secrets &
exec-once=uwsm app -- udiskie
exec-once=uwsm app -- swaync
exec-once=uwsm app -- hyprsunset --gamma_max 150 -g 100 -t 6500
exec-once=hyprctl hyprsunset identity
# Key remapper: Emacs-style movement/kill binds, scoped to Zen (config: ~/.config/xremap/config.yml)
exec-once=uwsm app -d "Xremap key remapper" -- xremap ~/.config/xremap/config.yml --watch=config,device

# Polkit agent
exec-once=uwsm app -d "Polkit authentication agent" -- ~/.config/hypr/scripts/polkit

# Cursor theme
exec-once=hyprctl setcursor Bibata-Modern-Classic 24

# KDE Connect and indicator
# Check if you have this service and if it's autostarted and enabled: /usr/share/dbus-1/services/org.kde.kdeconnect.service
# try using kdeconnect-cli --help
#exec-once=/usr/lib/x86_64-linux-gnu/libexec/kdeconnectd
#exec-once=kdeconnect-indicator
#exec-once=kdeconnectd

# Apps
exec-once=uwsm app -d "Emacs server" -- emacs --daemon
exec-once=uwsm app -- udev-block-notify
exec-once=uwsm app -d "Notify log" -- ~/.config/.local/bin/notify-log.sh /tmp/notify.log
exec-once=uwsm app -- nm-applet --indicator
exec-once=hyprpm reload -n
#exec-once=~/.config/hypr/ws-scripts/ws-kitty-2
exec-once=~/.config/hypr/ws-scripts/ws-emacs
exec-once=~/.config/hypr/ws-scripts/ws-zen
exec-once=uwsm app -- freetube --enable-features=WaylandWindowDecorations --ozone-platform-hint=auto --enable-features=VaapiVideoDecodeLinuxGL --gpu-context=wayland
exec-once=~/.config/hypr/ws-scripts/ws-zen-yt
exec-once=uwsm app -- ferdium --socket=wayland --ozone-platform-hint=auto --ozone-platform=wayland --enable-features-WaylandWindowDecorations

# Bluetooth fix for bluetoothctl: Failed to set power on: org.bluez.Error.Failed
exec-once=rfkill block bluetooth && rfkill unblock bluetooth
exec-once=uwsm app -- blueman-applet

# Wallpaper and waybar with pywal colors
exec-once=~/.config/hypr/scripts/wallpaper init
exec-once=sleep 2 && killall -SIGUSR1 waybar

# Switch to empty workspace
exec-once=sleep 2 && hyprctl dispatch workspace 6

# Cliphist clipboard manager
exec-once=uwsm app -a cliphist -- wl-paste -n --type text --watch cliphist store
exec-once=uwsm app -a cliphist -- wl-paste -n --type image --watch cliphist store

# Scripts
exec-once=~/.config/hypr/scripts/gtkthemes                # Apply themes - theme, cursor, icons and font
exec-once=~/.config/hypr/scripts/launch-portals           # Put it at the end
